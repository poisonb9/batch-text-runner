name: run

# O dado NAO vive aqui. Ele e' clonado de um repositorio privado no inicio da
# corrida, processado no runner, e devolvido ao mesmo lugar no fim. Nada do
# conteudo e' commitado neste repositorio.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "maximo de itens nesta corrida (0 = todos)"
        type: string
        default: "0"
      juntos:
        description: "quantos itens em paralelo"
        type: string
        default: "4"
      # ⛔ 0 = provedor unico, que e' o padrao historico. Misturar e' escolha
      #    explicita de quem dispara, nunca um default silencioso.
      mistura:
        description: "N de cada 10 lotes no provedor secundario (0 = nenhum)"
        type: string
        default: "0"
      # ⭐ De qual PONTA da lista pendente este fluxo tira o proximo lote.
      #    Dois fluxos em pontas opostas nunca escolhem o mesmo alvo enquanto
      #    houver mais de um lote pendente -- e' isso que permite os dois
      #    provedores trabalharem juntos sem colidir e sem pagar duas vezes.
      # ⚠️ Quando sobrar UM SO' lote, as duas pontas apontam para ele. O passo
      #    de selecao detecta isso e o fluxo secundario sai sem fazer nada.
      ponta:
        description: "de qual ponta tirar o lote: menor ou maior"
        type: string
        default: "menor"

# ⛔ O GRUPO E' POR PONTA, e nao unico. Com `group: run` so' UMA corrida existe
#    por vez, entao um segundo provedor nunca rodaria junto -- ele ficaria na
#    fila esperando o primeiro, que e' o oposto de trabalhar em paralelo.
# ⭐ Cada ponta tem seu proprio grupo: as duas correm ao mesmo tempo, e dentro
#    de cada ponta continua valendo uma de cada vez.
concurrency:
  group: run-${{ inputs.ponta || 'menor' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: chave de acesso ao armazenamento
        env:
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$STORE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: buscar os dados
        env:
          STORE_REPO: ${{ secrets.STORE_REPO }}
        # So' o necessario desce: os dados de entrada, os resultados ja' feitos
        # (para saber o que pular) e a configuracao. O codigo-fonte do
        # armazenamento NAO vem -- ele nao e' preciso aqui e carrega historico
        # do projeto que nao tem por que atravessar a rede a cada corrida.
        # Medido em 16/09: o clone cheio eram 269 MB, dos quais 13% uteis.
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout "$STORE_REPO" dados
          cd dados
          git sparse-checkout init --no-cone
          git sparse-checkout set '/corpus/' '/fichas/' '/instrucao_ia.json'
          git checkout
          # Guarda: sparse mal configurado devolve ZERO arquivo, e destilar o
          # vazio sairia "sucesso" sem produzir nada. Falha alto em vez disso.
          n=$(ls corpus 2>/dev/null | wc -l)
          echo "entradas: $n"
          if [ "$n" -eq 0 ]; then echo "sem entradas -- abortando"; exit 1; fi
          if [ ! -f instrucao_ia.json ]; then echo "sem configuracao -- abortando"; exit 1; fi

      - name: processar e devolver em pedacos
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
          OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
          OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
          OPENROUTER_API_KEY_9: ${{ secrets.OPENROUTER_API_KEY_9 }}
          OPENROUTER_API_KEY_10: ${{ secrets.OPENROUTER_API_KEY_10 }}
          OPENROUTER_API_KEY_11: ${{ secrets.OPENROUTER_API_KEY_11 }}
          OPENROUTER_API_KEY_12: ${{ secrets.OPENROUTER_API_KEY_12 }}
          OPENROUTER_API_KEY_13: ${{ secrets.OPENROUTER_API_KEY_13 }}
          OPENROUTER_API_KEY_14: ${{ secrets.OPENROUTER_API_KEY_14 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5: ${{ secrets.NVIDIA_API_KEY_5 }}
          NVIDIA_API_KEY_6: ${{ secrets.NVIDIA_API_KEY_6 }}
          NVIDIA_API_KEY_7: ${{ secrets.NVIDIA_API_KEY_7 }}
          NVIDIA_API_KEY_8: ${{ secrets.NVIDIA_API_KEY_8 }}
          # ⛔ Secret que o `env` NAO declara e' INVISIVEL ao processo: existe
          #    no repositorio e nao chega ao runner. Esse erro ja' fez este
          #    pipeline rodar com 26% da cota disponivel sem ninguem notar.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          # ⭐ Chave 9, achada em disco e TESTADA VIVA nos dois modelos
          #    em 16/09/2026. As de numero 2 e 7 sairam daqui: devolvem
          #    403 "project has been denied access" em 3 de 3 tentativas,
          #    com User-Agent (o erro 1010 do Cloudflare ja' nos enganou
          #    uma vez). ⛔ 403 condena; 503 NAO -- esse e' sobrecarga.
          #    Os secrets continuam no repositorio, so' deixam de ser
          #    exportados: chave morta no anel gasta uma rotacao por lote.
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          WORKERS: "8"
        # O alvo e' escolhido AQUI, a partir do que o armazenamento tem, e
        # nunca vem como entrada: entrada de workflow fica registrada na
        # corrida, e num repositorio publico isso publicaria o alvo.
        # Ele tambem nao e' ecoado -- so' o tamanho do lote.
        run: |
          # O GitHub roda o passo com `bash -eo pipefail`. Com `-e`, o primeiro
          # lote que falhar aborta a corrida inteira e os demais nem sao
          # tentados -- e foi assim que uma corrida de 1h02 virou nada.
          # Aqui o tratamento de erro e' NOSSO: cada codigo e' capturado, o
          # pior sobrevive ate' o fim, e a corrida termina com ele.
          set +e +o pipefail
          set +x
          export PONTA="${{ inputs.ponta || 'menor' }}"
          # ⛔ PEDACO: quantos videos por commit. A corrida 35171865637
          #    perdeu 5h inteiras porque o commit so' vinha no fim e o
          #    `timeout-minutes: 300` a cancelou antes. Agora o prejuizo
          #    maximo de um estouro e' UM pedaco.
          PEDACO=${PEDACO:-300}
          ALVO=$(python - <<'PY'
          import collections, os
          from pathlib import Path
          c = collections.Counter(p.name.split(' - ', 1)[0]
                                  for p in Path('dados/corpus').glob('*.txt')
                                  if p.name != 'full_text.txt')
          f = collections.Counter(p.name.split(' - ', 1)[0]
                                  for p in Path('dados/fichas').glob('*.json')
                                  if not p.name.endswith('.parcial.json'))
          falta = sorted((n, k) for k, n in c.items() if f.get(k, 0) < n)
          ponta = os.environ.get('PONTA', 'menor')
          # ⛔ COM UM LOTE SO', as duas pontas apontam para o mesmo alvo. O
          #    fluxo secundario sai VAZIO em vez de duplicar: dois provedores
          #    no mesmo lote pagariam o modelo duas vezes pelo mesmo texto, que
          #    e' exatamente o desperdicio que este desenho existe para evitar.
          if not falta or (ponta != 'menor' and len(falta) < 2):
              print('')
          else:
              # UMA CORRIDA POR ITEM E' QUASE SO' OVERHEAD. Medido em
              #    16/09/2026: a ponta `menor` pegou um lote de 1 video e a
              #    corrida levou 33 s -- checkout, setup-python e clone do
              #    armazenamento para destilar UM texto. Com dezenas de
              #    lotes curtos pendentes, a ponta gira sem produzir.
              #    Agora ela ACUMULA lotes curtos ate' juntar trabalho que
              #    pague a partida, e processa todos na MESMA corrida.
              # ⭐ AS DUAS PONTAS VARREM A MESMA LISTA CRESCENTE, em fatias
              #    diferentes. `menor` leva as primeiras ate' juntar MINIMO
              #    videos; `maior` comeca EXATAMENTE onde ela parou e leva as
              #    seguintes pela mesma regra. Sem sobreposicao, e a fila anda
              #    do menor para o maior ate' acabar.
              # ⛔ O desenho anterior mandava `maior` buscar o MAIOR lote, e
              #    lote gigante e' o que estoura o `timeout-minutes: 300`: o
              #    `ecommercenapratica` (2.013 videos) consumiu 5h e foi
              #    cancelado sem commitar nada.
              MINIMO = int(os.environ.get('ALVO_MINIMO', '60'))

              # ⛔⛔ A FATIA POR POSICAO NAO SEGURA, e isto foi medido em
              #    17/09/2026: cada corrida calcula a lista NO INSTANTE em que
              #    comeca. A ponta `maior` esperou 1h42 na fila do
              #    `concurrency`; quando rodou, a `menor` ja' tinha avancado e
              #    as duas fatias se sobrepuseram -- corrida inteira gasta para
              #    17 fichas num lote que ja' estava quase todo feito.
              # ⛔ PARIDADE DE INDICE TAMBEM NAO SEGURA, e a simulacao pegou
              #    isso antes de publicar: quando a `menor` fecha lotes, a
              #    lista ENCOLHE e todos os indices deslizam -- a `maior`, ao
              #    recalcular, cai em cima do que a outra ja' levou.
              # ⭐ A chave tem de ser INTRINSECA ao lote, nao a posicao dele.
              #    O nome do canal decide de que lado ele fica, por hash
              #    estavel. A lista pode encolher, crescer ou reordenar: o
              #    lado de cada lote nunca muda, e as duas pontas continuam
              #    varrendo do menor para o maior sem se cruzar.
              # ⚠️ `hash()` do Python NAO serve: ele e' aleatorizado por
              #    processo, entao as duas corridas dariam respostas
              #    diferentes para o mesmo nome.
              import hashlib
              def lado(nome):
                  d = hashlib.md5(nome.encode('utf-8')).hexdigest()
                  return int(d, 16) % 2 == 0
              meus = [(n, k) for n, k in falta if lado(k) == (ponta == 'menor')]
              escolhidos, soma = [], 0
              for n, k in meus:
                  escolhidos.append(k)
                  soma += n
                  if soma >= MINIMO:
                      break
              for k in escolhidos:
                  print(k)
          PY
          )
          if [ -z "$ALVO" ]; then echo "nada para esta ponta"; exit 0; fi
          echo "lotes nesta corrida: $(echo "$ALVO" | grep -c .)"
          pior=0
          echo "$ALVO" | while IFS= read -r alvo; do
            [ -z "$alvo" ] && continue
            total=$(ls dados/corpus | grep -c "^$alvo - ")
            echo "lote pendente: $total itens"
            # ⭐ Cada volta destila ate' PEDACO videos e COMMITA. Repetir e'
            #    seguro: o destilador pula quem ja' tem ficha, entao a volta
            #    seguinte nunca refaz a anterior. O laco para quando uma
            #    volta nao produz arquivo novo.
            while true; do
              python process.py \
                --corpus dados/corpus --fichas dados/fichas \
                --prefixo "$alvo" \
                --limite "$PEDACO" \
                --videos-juntos ${{ inputs.juntos || 4 }} \
                --gemini-em-dez ${{ inputs.mistura || 0 }} 2>&1 | tee /tmp/saida
              # ⛔ `$?` depois de um pipe e' do TEE, nao do python. O codigo
              #    do destilador vem de PIPESTATUS -- senao a corrida
              #    reportaria sucesso sobre uma falha, que e' o mesmo
              #    "exit 0 que mente" que ja' mordeu este projeto nove vezes.
              c=${PIPESTATUS[0]}
              echo "EXITCODE REAL: $c"
              [ "$c" -gt "$pior" ] && pior=$c
              echo "$pior" > /tmp/pior
            cd dados
            git config user.name "runner"
            git config user.email "runner@users.noreply.github.com"
            alvos=""
            for p in fichas corpus; do [ -e "$p" ] && alvos="$alvos $p"; done
            if [ -n "$alvos" ]; then
              git add $alvos
              if git diff --cached --quiet; then
                echo "nada novo neste pedaco."
              else
                git commit -q -m "runner: resultados novos ($(date -u +%Y-%m-%d))"
                # O pull ANTES do push, e sem empurrar por cima se falhar.
                # Com commits frequentes o remoto anda mais, nao menos.
                if git pull --rebase; then
                  git push && echo "PUSH EXITCODE REAL: $?"
                else
                  echo "rebase falhou -- NAO empurro; o trabalho fica no clone"
                fi
              fi
            fi
            cd ..
              # ⛔⛔ CONTAR ARQUIVO NAO MEDE TRABALHO. Video sem saida
              #    SOBRESCREVE o arquivo que ja' existia em `_falhas/`:
              #    mesmo nome, mesma contagem. O laco lia "nao rendeu" e
              #    largava o lote com centenas de pendentes -- medido, um
              #    lote de 308 itens encerrado apos processar 6.
              # ⭐ Quem sabe se houve trabalho e' o destilador. Zero video
              #    processado significa que nao ha mais o que fazer aqui.
              feitos=$(grep -oE 'videos destilados nesta corrida: [0-9]+' /tmp/saida | tail -1 | grep -oE '[0-9]+$')
              feitos=${feitos:-0}
              echo "videos processados neste pedaco: $feitos"
              if [ "$feitos" -eq 0 ]; then
                echo "pedaco nao processou video algum -- encerro este lote"
                break
              fi
            done
          done
          pior=$(cat /tmp/pior 2>/dev/null || echo 0)
          echo "PIOR EXITCODE REAL: $pior"
          exit "$pior"
