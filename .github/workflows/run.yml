name: run

# O dado NAO vive aqui. Ele e' clonado de um repositorio privado no inicio da
# corrida, processado no runner, e devolvido ao mesmo lugar no fim. Nada do
# conteudo e' commitado neste repositorio.
on:
  workflow_dispatch:
    inputs:
      limite:
        description: "maximo de itens nesta corrida (0 = todos)"
        type: string
        default: "0"
      juntos:
        description: "quantos itens em paralelo"
        type: string
        default: "4"
      # ⛔ 0 = provedor unico, que e' o padrao historico. Misturar e' escolha
      #    explicita de quem dispara, nunca um default silencioso.
      mistura:
        description: "N de cada 10 lotes no provedor secundario (0 = nenhum)"
        type: string
        default: "0"
      # ⭐ De qual PONTA da lista pendente este fluxo tira o proximo lote.
      #    Dois fluxos em pontas opostas nunca escolhem o mesmo alvo enquanto
      #    houver mais de um lote pendente -- e' isso que permite os dois
      #    provedores trabalharem juntos sem colidir e sem pagar duas vezes.
      # ⚠️ Quando sobrar UM SO' lote, as duas pontas apontam para ele. O passo
      #    de selecao detecta isso e o fluxo secundario sai sem fazer nada.
      ponta:
        description: "de qual ponta tirar o lote: menor ou maior"
        type: string
        default: "menor"

# ⛔ O GRUPO E' POR PONTA, e nao unico. Com `group: run` so' UMA corrida existe
#    por vez, entao um segundo provedor nunca rodaria junto -- ele ficaria na
#    fila esperando o primeiro, que e' o oposto de trabalhar em paralelo.
# ⭐ Cada ponta tem seu proprio grupo: as duas correm ao mesmo tempo, e dentro
#    de cada ponta continua valendo uma de cada vez.
concurrency:
  group: run-${{ inputs.ponta || 'menor' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: chave de acesso ao armazenamento
        env:
          STORE_KEY: ${{ secrets.STORE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$STORE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: buscar os dados
        env:
          STORE_REPO: ${{ secrets.STORE_REPO }}
        # So' o necessario desce: os dados de entrada, os resultados ja' feitos
        # (para saber o que pular) e a configuracao. O codigo-fonte do
        # armazenamento NAO vem -- ele nao e' preciso aqui e carrega historico
        # do projeto que nao tem por que atravessar a rede a cada corrida.
        # Medido em 16/09: o clone cheio eram 269 MB, dos quais 13% uteis.
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout "$STORE_REPO" dados
          cd dados
          git sparse-checkout init --no-cone
          git sparse-checkout set '/corpus/' '/fichas/' '/instrucao_ia.json'
          git checkout
          # Guarda: sparse mal configurado devolve ZERO arquivo, e destilar o
          # vazio sairia "sucesso" sem produzir nada. Falha alto em vez disso.
          n=$(ls corpus 2>/dev/null | wc -l)
          echo "entradas: $n"
          if [ "$n" -eq 0 ]; then echo "sem entradas -- abortando"; exit 1; fi
          if [ ! -f instrucao_ia.json ]; then echo "sem configuracao -- abortando"; exit 1; fi

      - name: processar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
          OPENROUTER_API_KEY_7: ${{ secrets.OPENROUTER_API_KEY_7 }}
          OPENROUTER_API_KEY_8: ${{ secrets.OPENROUTER_API_KEY_8 }}
          OPENROUTER_API_KEY_9: ${{ secrets.OPENROUTER_API_KEY_9 }}
          OPENROUTER_API_KEY_10: ${{ secrets.OPENROUTER_API_KEY_10 }}
          OPENROUTER_API_KEY_11: ${{ secrets.OPENROUTER_API_KEY_11 }}
          OPENROUTER_API_KEY_12: ${{ secrets.OPENROUTER_API_KEY_12 }}
          OPENROUTER_API_KEY_13: ${{ secrets.OPENROUTER_API_KEY_13 }}
          OPENROUTER_API_KEY_14: ${{ secrets.OPENROUTER_API_KEY_14 }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          NVIDIA_API_KEY_5: ${{ secrets.NVIDIA_API_KEY_5 }}
          NVIDIA_API_KEY_6: ${{ secrets.NVIDIA_API_KEY_6 }}
          NVIDIA_API_KEY_7: ${{ secrets.NVIDIA_API_KEY_7 }}
          NVIDIA_API_KEY_8: ${{ secrets.NVIDIA_API_KEY_8 }}
          # ⛔ Secret que o `env` NAO declara e' INVISIVEL ao processo: existe
          #    no repositorio e nao chega ao runner. Esse erro ja' fez este
          #    pipeline rodar com 26% da cota disponivel sem ninguem notar.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          WORKERS: "8"
        # O alvo e' escolhido AQUI, a partir do que o armazenamento tem, e
        # nunca vem como entrada: entrada de workflow fica registrada na
        # corrida, e num repositorio publico isso publicaria o alvo.
        # Ele tambem nao e' ecoado -- so' o tamanho do lote.
        run: |
          set +x
          export PONTA="${{ inputs.ponta || 'menor' }}"
          ALVO=$(python - <<'PY'
          import collections, os
          from pathlib import Path
          c = collections.Counter(p.name.split(' - ', 1)[0]
                                  for p in Path('dados/corpus').glob('*.txt')
                                  if p.name != 'full_text.txt')
          f = collections.Counter(p.name.split(' - ', 1)[0]
                                  for p in Path('dados/fichas').glob('*.json')
                                  if not p.name.endswith('.parcial.json'))
          falta = sorted((n, k) for k, n in c.items() if f.get(k, 0) < n)
          ponta = os.environ.get('PONTA', 'menor')
          # ⛔ COM UM LOTE SO', as duas pontas apontam para o mesmo alvo. O
          #    fluxo secundario sai VAZIO em vez de duplicar: dois provedores
          #    no mesmo lote pagariam o modelo duas vezes pelo mesmo texto, que
          #    e' exatamente o desperdicio que este desenho existe para evitar.
          if not falta or (ponta != 'menor' and len(falta) < 2):
              print('')
          else:
              print(falta[-1][1] if ponta != 'menor' else falta[0][1])
          PY
          )
          if [ -z "$ALVO" ]; then echo "nada para esta ponta"; exit 0; fi
          echo "lote pendente: $(ls dados/corpus | grep -c "^$ALVO - ") itens"
          python process.py \
            --corpus dados/corpus --fichas dados/fichas \
            --prefixo "$ALVO" \
            --limite ${{ inputs.limite || 0 }} \
            --videos-juntos ${{ inputs.juntos || 4 }} \
            --gemini-em-dez ${{ inputs.mistura || 0 }}
          echo "EXITCODE REAL: $?"

      # Puxar antes de empurrar: o armazenamento pode ter andado durante a
      # corrida, e um push cego devolve `fetch first` e descarta o trabalho.
      # So' os caminhos existentes entram no `add`: pathspec que nao casa faz o
      # `git add` NAO estagiar nada, inclusive o que era valido.
      - name: devolver o resultado
        run: |
          cd dados
          git config user.name "runner"
          git config user.email "runner@users.noreply.github.com"
          alvos=""
          for p in fichas corpus; do [ -e "$p" ] && alvos="$alvos $p"; done
          [ -z "$alvos" ] && { echo "nada a estagiar"; exit 1; }
          git add $alvos
          if git diff --cached --quiet; then
            echo "nada novo."
          else
            git commit -q -m "runner: resultados novos ($(date -u +%Y-%m-%d))"
            git pull --rebase || { echo "rebase falhou -- NAO empurro"; exit 1; }
            git push
            echo "PUSH EXITCODE REAL: $?"
          fi
